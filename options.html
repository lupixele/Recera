<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meth — Engine Configuration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 36px 24px; }

    .header-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-logo { width: 28px; height: 28px; }
    h1 { font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }

    .section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    label span { color: #64748b; font-weight: 400; font-size: 12px; margin-left: 6px; }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 12px;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.3);
    }

    .row { display: flex; gap: 16px; }
    .row .field { flex: 1; }

    .presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .preset-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #38bdf8;
      color: #f8fafc;
    }

    .hint { font-size: 11px; color: #64748b; margin-top: 5px; line-height: 1.4; }

    .actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
    .btn-save {
      padding: 10px 24px;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
      transition: all 0.15s;
    }
    .btn-save:hover { filter: brightness(1.1); }
    .btn-save:active { transform: scale(0.97); }

    .btn-test {
      padding: 10px 18px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-test:hover { background: rgba(16, 185, 129, 0.25); }

    .test-result { margin-top: 12px; font-size: 12px; padding: 10px 14px; border-radius: 6px; display: none; }
    .test-result.ok  { display: block; background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .test-result.err { display: block; background: rgba(244, 63, 94, 0.1); color: #f87171; border: 1px solid rgba(244, 63, 94, 0.3); }

    .delay-row { display: flex; align-items: center; gap: 12px; }
    .delay-row input[type="range"] { flex: 1; accent-color: #38bdf8; }
    .delay-val { min-width: 60px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: #94a3b8; }

    .saved-toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #10b981; color: #022c22; padding: 10px 20px;
      border-radius: 8px; font-weight: 600; font-size: 13px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }
    .saved-toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header-bar">
    <svg class="brand-logo" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="16" height="16" rx="3.5" fill="#0284c7"/>
      <path d="M3.8 12.5V3.5h4.4c1.8 0 3 1.1 3 2.7 0 1.3-.8 2.2-2 2.5l2.4 3.8h-2.1L7.4 8.9H5.6v3.6H3.8zm1.8-5.1h2.5c.8 0 1.3-.5 1.3-1.2s-.5-1.2-1.3-1.2H5.6v2.4z" fill="#f8fafc"/>
      <circle cx="12.5" cy="3.5" r="1.2" fill="#38bdf8"/>
    </svg>
    <div>
      <h1>Recera Settings</h1>
      <p class="subtitle">Precision AI Solver & Automation Engine Configuration</p>
    </div>
  </div>

  <!-- Gateway Presets -->
  <div class="section">
    <div class="section-title">Quick Presets</div>
    <div class="presets">
      <button class="preset-btn" data-preset="nemotron">⚡ Nemotron 120B</button>
      <button class="preset-btn" data-preset="ollama">🦙 Ollama (llama3.2)</button>
      <button class="preset-btn" data-preset="lmstudio">📦 LM Studio</button>
      <button class="preset-btn" data-preset="openai">☁️ OpenAI (gpt-4o-mini)</button>
      <button class="preset-btn" data-preset="groq">⚡ Groq (llama-3.1-8b)</button>
    </div>
  </div>

  <!-- Model Gateway -->
  <div class="section">
    <div class="section-title">LLM Gateway</div>

    <div class="row">
      <div class="field">
        <label>Base URL <span>without /chat/completions</span></label>
        <input type="text" id="baseUrl" placeholder="http://localhost:11434/v1" value="">
      </div>
      <div class="field" style="max-width:180px">
        <label>API Key</label>
        <input type="text" id="apiKey" placeholder="ollama / sk-…" value="">
      </div>
    </div>

    <div class="field">
      <label>Model ID <span>exact gateway identifier</span></label>
      <input type="text" id="model" placeholder="nvidia/nvidia/nemotron-3-super-120b-a12b" value="">
      <p class="hint">Must match the registered Model ID on your provider.</p>
    </div>

    <div class="row">
      <div class="field">
        <label>Max Tokens <span>reasoning budget</span></label>
        <input type="number" id="maxTokens" min="32" max="4096" step="64" value="1024">
        <p class="hint">1024+ recommended for reasoning models.</p>
      </div>
      <div class="field">
        <label>Timeout (seconds)</label>
        <input type="number" id="timeout" min="10" max="180" value="60">
      </div>
      <div class="field">
        <label>Max Retries</label>
        <input type="number" id="maxRetries" min="0" max="5" value="2">
      </div>
    </div>
  </div>

  <!-- Timing -->
  <div class="section">
    <div class="section-title">Execution Timing & Resilience</div>

    <div class="field">
      <label>Delay between questions (ms)</label>
      <div class="delay-row">
        <input type="range" id="delayMs" min="500" max="15000" step="500" value="2000">
        <span class="delay-val" id="delayVal">2000 ms</span>
      </div>
    </div>

    <div class="field">
      <label>Unparseable Answer Fallback</label>
      <select id="fallbackAction">
        <option value="guess_a">Select Option A and proceed (Prevents freezing)</option>
        <option value="pause">Pause engine for manual intervention</option>
      </select>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-save" id="btnSave">💾 Save Settings</button>
    <button class="btn-test" id="btnTest">🧪 Test Connection</button>
    <div id="testResult" class="test-result"></div>
  </div>
</div>

<div class="saved-toast" id="toast">✓ Settings saved</div>

<script src="options.js"></script>
</body>
</html>
