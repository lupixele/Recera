<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meth — Precision Assessment Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      background: #0b1120;
      color: #f1f5f9;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo { width: 20px; height: 20px; }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      background: rgba(2, 132, 199, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: auto;
    }
    #settings-icon {
      background: none; border: none; color: #94a3b8; cursor: pointer;
      font-size: 14px; padding: 4px; border-radius: 4px; transition: 0.15s;
    }
    #settings-icon:hover { background: rgba(255, 255, 255, 0.08); color: #f8fafc; }

    /* Segmented Navigation */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s ease;
      user-select: none;
    }
    .tab-btn:hover { color: #f8fafc; background: rgba(255, 255, 255, 0.04); }
    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Tab Content Views */
    .tab-content { display: none; padding: 14px 16px; }
    .tab-content.active { display: block; }

    /* Status Card */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #64748b; flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.idle    { background: #64748b; }
    .status-dot.running { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .status-dot.paused  { background: #f59e0b; }
    .status-dot.done    { background: #38bdf8; }

    .counter {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: #94a3b8;
    }
    .counter strong { color: #f8fafc; font-weight: 600; }

    /* Action Grid */
    .action-grid {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .action-btn {
      flex: 1;
      padding: 9px 0;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-start   {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #022c22;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-pause   { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }
    .btn-stop    { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
    .btn-reset   { background: rgba(255, 255, 255, 0.05); color: #cbd5e1; border-color: rgba(255, 255, 255, 0.08); }
    .btn-primary { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
    .btn-primary:hover { background: rgba(56, 189, 248, 0.25); }

    /* Terminal Console */
    .terminal-window {
      height: 180px;
      overflow-y: auto;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.55;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
    .line-log { display: flex; gap: 8px; margin-bottom: 3px; }
    .line-ts   { color: #475569; flex-shrink: 0; }
    .line-info { color: #94a3b8; }
    .line-ok   { color: #34d399; }
    .line-warn { color: #fbbf24; }
    .line-err  { color: #f87171; }
    .line-req  { color: #38bdf8; }

    /* Flow Card */
    .flow-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .flow-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .flow-title {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .flow-badge {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .flow-badge.ready {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.35);
      background: rgba(16, 185, 129, 0.1);
    }

    textarea {
      width: 100%;
      height: 84px;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      color: #f8fafc;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 11px;
      padding: 8px 10px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }

    .chips-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 64px;
      overflow-y: auto;
      background: #020617;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 8px;
    }
    .ans-chip {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .ans-chip strong { color: #38bdf8; }

    /* Footer */
    .footer {
      padding: 9px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .footer a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <svg class="brand-logo" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="16" height="16" rx="3.5" fill="#0284c7"/>
      <path d="M3.8 12.5V3.5h4.4c1.8 0 3 1.1 3 2.7 0 1.3-.8 2.2-2 2.5l2.4 3.8h-2.1L7.4 8.9H5.6v3.6H3.8zm1.8-5.1h2.5c.8 0 1.3-.5 1.3-1.2s-.5-1.2-1.3-1.2H5.6v2.4z" fill="#f8fafc"/>
      <circle cx="12.5" cy="3.5" r="1.2" fill="#38bdf8"/>
    </svg>
    <h1 id="brandTitle">Recera</h1>
    <span class="badge">v2.1</span>
    <button id="settings-icon" title="Open Settings">⚙</button>
  </div>

  <!-- Segmented Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabLiveBtn">⚡ Live AI Solver</button>
    <button class="tab-btn" id="tabBatchBtn">📋 Prompt & Batch Fill</button>
  </div>

  <!-- TAB 1: Live AI Solver -->
  <div class="tab-content active" id="tabLiveContent">
    <div class="status-pill">
      <div class="status-dot" id="liveStatusDot"></div>
      <span id="liveStatusText">Engine Ready</span>
      <div class="counter">
        Q <strong id="liveQCurrent">0</strong> / <strong id="liveQTotal">0</strong>
      </div>
    </div>

    <div class="action-grid">
      <button class="action-btn btn-start" id="btnLiveStart">▶ Start</button>
      <button class="action-btn btn-pause" id="btnLivePause" disabled>⏸ Pause</button>
      <button class="action-btn btn-stop"  id="btnLiveStop"  disabled>■ Stop</button>
      <button class="action-btn btn-reset" id="btnLiveReset">↺</button>
    </div>

    <div class="terminal-window" id="liveLogContainer"></div>
  </div>

  <!-- TAB 2: Batch Export & Fill -->
  <div class="tab-content" id="tabBatchContent">
    
    <!-- Step 1: Export -->
    <div class="flow-card">
      <div class="flow-head">
        <span class="flow-title">1. Export Questions</span>
        <span class="flow-badge" id="exportBadge">0 extracted</span>
      </div>
      <div class="action-grid" style="margin-bottom:0;">
        <button class="action-btn btn-primary" id="btnExtractAll">📥 Extract All</button>
        <button class="action-btn btn-reset"   id="btnCopyPrompt" disabled>📋 Copy Prompt</button>
      </div>
      <textarea id="promptPreviewText" style="display:none; margin-top:8px;" readonly></textarea>
    </div>

    <!-- Step 2: Paste Answers -->
    <div class="flow-card">
      <div class="flow-head">
        <span class="flow-title">2. Paste Answers</span>
        <span class="flow-badge" id="answersCountBadge">0 loaded</span>
      </div>
      <textarea id="pastedAnswersInput" placeholder="Paste model output (e.g. 1. A, 2. B, Q1: C, or JSON)..."></textarea>
      <button class="action-btn btn-reset" id="btnParseAnswers" style="margin-top:8px; width:100%;">🔍 Parse Answers</button>
      <div class="chips-preview" id="answersPreviewList" style="display:none;"></div>
    </div>

    <!-- Step 3: Run Auto-Fill -->
    <div class="flow-card" style="margin-bottom:0;">
      <div class="flow-head">
        <span class="flow-title">3. Auto-Fill Answers</span>
        <span class="flow-badge" id="fillStatusBadge">Idle</span>
      </div>
      <div class="action-grid" style="margin-bottom:0;">
        <button class="action-btn btn-start" id="btnFillStart" disabled>▶ Start Fill</button>
        <button class="action-btn btn-pause" id="btnFillPause" disabled>⏸ Pause</button>
        <button class="action-btn btn-stop"  id="btnFillStop"  disabled>■ Stop</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" id="openOptions">⚙ Settings</a>
    <span id="activeModelLabel" style="color:#64748b;">Model: Default</span>
  </div>

<script src="popup.js"></script>
</body>
</html>
